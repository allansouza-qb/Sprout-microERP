# Render Blueprint (https://render.com/docs/blueprint-spec): one free web
# service built from the Dockerfile and one free PostgreSQL database.
databases:
  - name: sprout-erp-db
    plan: free
    databaseName: sprout_erp

services:
  - type: web
    name: sprout-erp
    runtime: docker
    plan: free
    # Migrations and demo data run at start: the free plan has no pre-deploy step.
    dockerCommand: /app/bin/demo
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sprout-erp-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: POOL_SIZE
        value: "5"
